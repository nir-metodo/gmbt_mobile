apply plugin: 'com.android.library'

group = 'com.gambot.callui'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "com.gambot.callui"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.12.0"
  // The incoming-call push is received by a subclass of expo-notifications' messaging service
  // (every other push keeps going through expo-notifications untouched).
  // Expo SDK 54 builds expo-notifications from a precompiled maven artifact on EAS (no ':expo-notifications'
  // gradle project there), so use the project when it exists and the published artifact otherwise.
  def notificationsProject = rootProject.findProject(':expo-notifications')
  if (notificationsProject != null) {
    implementation notificationsProject
  } else {
    def notificationsPkg = new File(projectDir, "../../../node_modules/expo-notifications/package.json")
    def notificationsVersion = new groovy.json.JsonSlurper().parse(notificationsPkg).version
    implementation "host.exp.exponent:expo.modules.notifications:${notificationsVersion}"
  }
  implementation 'com.google.firebase:firebase-messaging:24.0.1'
}
